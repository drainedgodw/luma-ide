name: Release Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package Windows installer and portable build
        run: npx electron-builder --win nsis portable --publish never
      - name: Create checksums
        shell: pwsh
        run: |
          Get-FileHash dist/* -Algorithm SHA256 | Format-Table -HideTableHeaders | Out-File dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: false
